name: Offline compressed PRM candidate regression
on:
  push:
    branches: [port/full-api-v170]
  workflow_dispatch:
jobs:
  compressed-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/requirements.txt
      - name: Verify synthetic compressed candidate and source integrity
        run: PYTHONPATH=tools python -m unittest discover -s tests -p test_export_compressed_prm_candidate.py -v
      - name: Verify atomic compressed batch candidates
        run: PYTHONPATH=tools python -m unittest discover -s tests -p test_export_compressed_prm_batch.py -v
      - name: Independently verify source-bound compressed candidates (synthetic)
        run: PYTHONPATH=tools:tests python -m unittest discover -s tests -p test_verify_compressed_prm_batch.py -v
