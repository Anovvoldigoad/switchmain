name: Build NSC P86A BDA4 BDC8 Producer Probe

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - name: Checkout P86A source
        uses: actions/checkout@v4

      - name: Verify repository layout
        shell: bash
        run: |
          set -euxo pipefail
          test -f .github/workflows/build-subsdk9-p86a.yml
          test -f prepare_exlaunch_p67a.sh
          test -f verify_p86a_source.py
          test -f overlay/source/program/main.cpp
          test -f overlay/source/program/nsc_cpk_bridge.cpp
          test -f overlay/source/program/nsc_cpk_bridge.hpp
          test -f overlay/source/program/p81_ougi_awake_ids.hpp
          test -f deploy/atmosphere/contents/0100FA10190A0000/exefs/main
          test -f restore/atmosphere/contents/0100FA10190A0000/exefs/main

      - name: Verify devkitPro toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          test -x "$DEVKITA64/bin/aarch64-none-elf-g++"
          "$DEVKITA64/bin/aarch64-none-elf-g++" --version
          command -v git
          command -v python3

      - name: Verify generated tables, P86A source, and paired main
        shell: bash
        run: |
          set -euxo pipefail
          python3 generate_condition_table.py condition_compat_manifest.json /tmp/condition_compat_generated.hpp
          cmp /tmp/condition_compat_generated.hpp overlay/source/program/condition_compat_generated.hpp
          python3 verify_p86a_source.py
          printf '%s  %s\n' \
            '1adc4dfe948d616cbb7c6d9b3672842aba8e7d86bf0763e668505dff84234de0' \
            'deploy/atmosphere/contents/0100FA10190A0000/exefs/main' | sha256sum -c -
          printf '%s  %s\n' \
            '2579b0cb85b79d5515a2518caeb5d5721168dbc1ec3f92c46eb372d13488ecd9' \
            'restore/atmosphere/contents/0100FA10190A0000/exefs/main' | sha256sum -c -

      - name: Clone pinned exlaunch
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/shadowninja108/exlaunch.git "$GITHUB_WORKSPACE/exlaunch"
          git -C "$GITHUB_WORKSPACE/exlaunch" checkout --detach 229bbd6
          git -C "$GITHUB_WORKSPACE/exlaunch" submodule update --init --recursive
          test "$(git -C "$GITHUB_WORKSPACE/exlaunch" rev-parse --short HEAD)" = "229bbd6"

      - name: Overlay active P86A source lineage
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' prepare_exlaunch_p67a.sh || true
          chmod +x prepare_exlaunch_p67a.sh
          bash ./prepare_exlaunch_p67a.sh "$GITHUB_WORKSPACE/exlaunch"
          grep -F 'ELF_EXTRACT := $(PWD)/p67a_final.elf' "$GITHUB_WORKSPACE/exlaunch/config.mk"
          grep -Fq 'InstallP86ABda4Bdc8ProducerProbe' "$GITHUB_WORKSPACE/exlaunch/source/program/main.cpp"
          grep -Fq '[NSC:P86A] READY' "$GITHUB_WORKSPACE/exlaunch/source/program/nsc_cpk_bridge.cpp"

      - name: Build subsdk9
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          cd "$GITHUB_WORKSPACE/exlaunch"
          make -j2

      - name: Verify linked P86A and collect artifact
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          OUT="exlaunch/deploy/subsdk9"
          ELF="exlaunch/p67a_final.elf"
          test -s "$OUT"
          test -s "$ELF"

          grep -aFq '[NSC:P86A] READY' "$ELF"
          grep -aFq '[NSC:P86A] STATE' "$ELF"
          grep -aFq '[NSC:P86A] INPUT_PRED' "$ELF"
          grep -aFq '[NSC:P86A] ACTOR_PRED' "$ELF"
          grep -aFq '[NSC:P85A] READY' "$ELF"
          grep -aFq '[NSC:P84A] READY' "$ELF"
          grep -aFq '[NSC:P81A] READY' "$ELF"
          grep -aFq '[NSC:P50A] READY' "$ELF"

          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          b = p.read_bytes()
          assert len(b) > 10000, len(b)
          assert b[:4] == b'NSO0', b[:4]
          print('P86A_NSO_VERIFY=PASS')
          PY

          rm -rf artifact
          mkdir -p artifact/atmosphere/contents/0100FA10190A0000/exefs
          cp "$OUT" artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9
          cp deploy/atmosphere/contents/0100FA10190A0000/exefs/main artifact/atmosphere/contents/0100FA10190A0000/exefs/main
          mkdir -p artifact/restore/atmosphere/contents/0100FA10190A0000/exefs
          cp restore/atmosphere/contents/0100FA10190A0000/exefs/main artifact/restore/atmosphere/contents/0100FA10190A0000/exefs/main
          cp README_P86A.txt analyze_p86a_log.py verify_p86a_source.py P86_STATIC_AUDIT.txt artifact/
          (cd artifact && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          sha256sum "$OUT" "$ELF"

      - name: Upload P86A artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC-P86A-bda4-bdc8-producer-probe
          path: artifact/
          compression-level: 9
