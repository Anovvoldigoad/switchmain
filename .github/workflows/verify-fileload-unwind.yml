name: Verify pinned FileLoad unwind metadata and caller coverage
on:
  workflow_dispatch:
  push:
    branches: [port/full-api-v170]
    paths:
      - 'original/atmosphere/contents/0100FA10190A0000/exefs/main'
      - 'tools/portlib/native_fileload_unwind.py'
      - 'tests/test_native_fileload_unwind.py'
      - '.github/workflows/verify-fileload-unwind.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned AArch64 decoder
        run: python -m pip install capstone==5.0.6
      - name: Reproduce pinned NSO unwind metadata and map all FileLoad helper callers
        run: PYTHONPATH=tools python tests/test_native_fileload_unwind.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - uses: actions/upload-artifact@v4
        with:
          name: FILELOAD_UNWIND_STATIC_EVIDENCE
          path: proof-work/native_fileload_unwind.json
          if-no-files-found: error
