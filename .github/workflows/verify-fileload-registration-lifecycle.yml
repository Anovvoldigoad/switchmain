name: Verify pinned FileLoad registration lifecycle evidence
on:
  workflow_dispatch:
  push:
    branches: [port/full-api-v170]
    paths:
      - 'tools/portlib/native_fileload_registration_lifecycle.py'
      - 'tests/test_native_fileload_registration_lifecycle.py'
      - 'tools/portlib/native_fileload_table_access.py'
      - 'tests/test_native_fileload_table_access.py'
      - 'tools/portlib/native_fileload_table_cfg.py'
      - 'tests/test_native_fileload_table_cfg.py'
      - 'original/atmosphere/contents/0100FA10190A0000/exefs/main'
      - '.github/workflows/verify-fileload-registration-lifecycle.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned AArch64 decoder
        run: python -m pip install capstone==5.0.6
      - name: Reproduce registration helper, relocation and bounded target proofs
        if: github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ','), 'native_fileload_registration_lifecycle.py') || contains(join(github.event.head_commit.added, ','), 'native_fileload_registration_lifecycle.py') || contains(join(github.event.head_commit.modified, ','), 'test_native_fileload_registration_lifecycle.py') || contains(join(github.event.head_commit.added, ','), 'test_native_fileload_registration_lifecycle.py') || contains(join(github.event.head_commit.modified, ','), 'original/atmosphere/contents/0100FA10190A0000/exefs/main')
        run: PYTHONPATH=tools python tests/test_native_fileload_registration_lifecycle.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ','), 'native_fileload_registration_lifecycle.py') || contains(join(github.event.head_commit.added, ','), 'native_fileload_registration_lifecycle.py') || contains(join(github.event.head_commit.modified, ','), 'test_native_fileload_registration_lifecycle.py') || contains(join(github.event.head_commit.added, ','), 'test_native_fileload_registration_lifecycle.py') || contains(join(github.event.head_commit.modified, ','), 'original/atmosphere/contents/0100FA10190A0000/exefs/main')
        with:
          name: FILELOAD_REGISTRATION_LIFECYCLE_STATIC_EVIDENCE
          path: proof-work/native_fileload_registration_lifecycle.json
          if-no-files-found: error
      - name: Reproduce direct 64-slot table references and RELA inventory
        if: github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ','), 'native_fileload_table_access.py') || contains(join(github.event.head_commit.added, ','), 'native_fileload_table_access.py') || contains(join(github.event.head_commit.modified, ','), 'test_native_fileload_table_access.py') || contains(join(github.event.head_commit.added, ','), 'test_native_fileload_table_access.py') || contains(join(github.event.head_commit.modified, ','), 'original/atmosphere/contents/0100FA10190A0000/exefs/main')
        run: PYTHONPATH=tools python tests/test_native_fileload_table_access.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output table-proof-work
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ','), 'native_fileload_table_access.py') || contains(join(github.event.head_commit.added, ','), 'native_fileload_table_access.py') || contains(join(github.event.head_commit.modified, ','), 'test_native_fileload_table_access.py') || contains(join(github.event.head_commit.added, ','), 'test_native_fileload_table_access.py') || contains(join(github.event.head_commit.modified, ','), 'original/atmosphere/contents/0100FA10190A0000/exefs/main')
        with:
          name: FILELOAD_TABLE_ACCESS_STATIC_EVIDENCE
          path: table-proof-work/native_fileload_table_access.json
          if-no-files-found: error
      - name: Reproduce bounded CFG branch paths and static pointer aliases
        if: github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ','), 'native_fileload_table_cfg.py') || contains(join(github.event.head_commit.added, ','), 'native_fileload_table_cfg.py') || contains(join(github.event.head_commit.modified, ','), 'test_native_fileload_table_cfg.py') || contains(join(github.event.head_commit.added, ','), 'test_native_fileload_table_cfg.py') || contains(join(github.event.head_commit.modified, ','), 'original/atmosphere/contents/0100FA10190A0000/exefs/main') || contains(join(github.event.head_commit.modified, ','), '.github/workflows/verify-fileload-registration-lifecycle.yml')
        run: PYTHONPATH=tools python tests/test_native_fileload_table_cfg.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output table-cfg-proof-work
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ','), 'native_fileload_table_cfg.py') || contains(join(github.event.head_commit.added, ','), 'native_fileload_table_cfg.py') || contains(join(github.event.head_commit.modified, ','), 'test_native_fileload_table_cfg.py') || contains(join(github.event.head_commit.added, ','), 'test_native_fileload_table_cfg.py') || contains(join(github.event.head_commit.modified, ','), 'original/atmosphere/contents/0100FA10190A0000/exefs/main') || contains(join(github.event.head_commit.modified, ','), '.github/workflows/verify-fileload-registration-lifecycle.yml')
        with:
          name: FILELOAD_TABLE_CFG_STATIC_EVIDENCE
          path: table-cfg-proof-work/native_fileload_table_cfg.json
          if-no-files-found: error
