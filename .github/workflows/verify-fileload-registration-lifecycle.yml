name: Verify pinned FileLoad registration lifecycle evidence
on:
  workflow_dispatch:
  push:
    branches: [port/full-api-v170]
    paths:
      - 'tools/portlib/native_fileload_registration_lifecycle.py'
      - 'tests/test_native_fileload_registration_lifecycle.py'
      - 'tools/portlib/native_fileload_table_access.py'
      - 'tests/test_native_fileload_table_access.py'
      - 'original/atmosphere/contents/0100FA10190A0000/exefs/main'
      - 'tools/portlib/native_fileload_unwind.py'
      - 'tests/test_native_fileload_unwind.py'
      - '.github/workflows/verify-fileload-registration-lifecycle.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned AArch64 decoder
        run: python -m pip install capstone==5.0.6
      - name: Detect changes requiring the existing lifecycle/table regressions
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -Eq '^(tools/portlib/native_fileload_registration_lifecycle.py|tests/test_native_fileload_registration_lifecycle.py|tools/portlib/native_fileload_table_access.py|tests/test_native_fileload_table_access.py|original/atmosphere/contents/0100FA10190A0000/exefs/main)$'; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          else
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reproduce registration helper, relocation and bounded target proofs
        if: steps.scope.outputs.legacy == 'true'
        run: PYTHONPATH=tools python tests/test_native_fileload_registration_lifecycle.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - name: Reproduce direct 64-slot table references and RELA inventory
        if: steps.scope.outputs.legacy == 'true'
        run: PYTHONPATH=tools python tests/test_native_fileload_table_access.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output table-proof-work
      - name: Reproduce pinned FileLoad unwind metadata and map all helper callers
        run: PYTHONPATH=tools python tests/test_native_fileload_unwind.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output unwind-proof-work
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.legacy == 'true'
        with:
          name: FILELOAD_REGISTRATION_LIFECYCLE_STATIC_EVIDENCE
          path: proof-work/native_fileload_registration_lifecycle.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.legacy == 'true'
        with:
          name: FILELOAD_TABLE_ACCESS_STATIC_EVIDENCE
          path: table-proof-work/native_fileload_table_access.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FILELOAD_UNWIND_STATIC_EVIDENCE
          path: unwind-proof-work/native_fileload_unwind.json
          if-no-files-found: error
