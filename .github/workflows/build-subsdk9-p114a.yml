name: Build NSC P114A type9 preflight provenance read-only probe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight P114A drop-in kit
        run: |
          set -eux
          python3 verify_p114a_source.py
      - name: Bootstrap pinned exlaunch
        run: |
          set -eux
          rm -rf exlaunch
          git clone https://github.com/shadowninja108/exlaunch.git exlaunch
          git -C exlaunch checkout --detach 229bbd6
          git -C exlaunch submodule update --init --recursive
      - name: Prepare
        run: |
          set -eux
          chmod +x prepare_exlaunch.sh
          ./prepare_exlaunch.sh
          grep -Fq '[NSC:P114A] READY' exlaunch/source/program/nsc_cpk_bridge.cpp
          grep -Fq '[NSC:P114A] PREFLIGHT' exlaunch/source/program/nsc_cpk_bridge.cpp
          grep -Fq 'P114APreflightType9QueryHook' exlaunch/source/program/nsc_cpk_bridge.cpp
          grep -Fq 'nsc::InstallP114APreflightType9Probe();' exlaunch/source/program/main.cpp
          ! grep -Fq '[NSC:P113A]' exlaunch/source/program/nsc_cpk_bridge.cpp
          ! grep -Fq '[NSC:P112B]' exlaunch/source/program/nsc_cpk_bridge.cpp
          ! grep -Fq '[NSC:P111A]' exlaunch/source/program/nsc_cpk_bridge.cpp
      - name: Build
        working-directory: exlaunch
        run: make -j2
      - name: Verify linked markers
        run: |
          set -eux
          ELF="$(find exlaunch -maxdepth 2 -type f -name '*_final.elf' -size +10k -print -quit)"
          test -n "$ELF"
          grep -aFq '[NSC:P114A] READY' "$ELF"
          grep -aFq '[NSC:P114A] PREFLIGHT' "$ELF"
          grep -aFq '[NSC:P96A] READY' "$ELF"
          grep -aFq '[NSC:P89A] READY' "$ELF"
          ! grep -aFq '[NSC:P113A]' "$ELF"
          ! grep -aFq '[NSC:P112B]' "$ELF"
      - name: Package
        run: |
          set -eux
          OUT="$(find exlaunch -type f -name subsdk9 -size +10k -print -quit)"
          test -n "$OUT"
          rm -rf artifact
          mkdir -p artifact/atmosphere/contents/0100FA10190A0000/exefs artifact/restore/atmosphere/contents/0100FA10190A0000/exefs
          cp "$OUT" artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9
          cp paired/atmosphere/contents/0100FA10190A0000/exefs/main artifact/atmosphere/contents/0100FA10190A0000/exefs/main
          cp restore/atmosphere/contents/0100FA10190A0000/exefs/main artifact/restore/atmosphere/contents/0100FA10190A0000/exefs/main
          (cd artifact && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NSC-P114A-type9-preflight-provenance-readonly
          path: artifact/
          if-no-files-found: error
