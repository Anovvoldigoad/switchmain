name: Build NSC P88B boot-safe UJ helper probe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64

    steps:
      - uses: actions/checkout@v4

      - name: Verify P88B source
        run: python3 verify_p88b_source.py

      - name: Clone pinned exlaunch
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/shadowninja108/exlaunch.git exlaunch
          git -C exlaunch checkout --detach 229bbd6
          git -C exlaunch submodule update --init --recursive

      - name: Apply overlay
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x prepare_exlaunch.sh
          bash ./prepare_exlaunch.sh "$GITHUB_WORKSPACE/exlaunch"

          grep -q '\[NSC:P88B\]' \
            "$GITHUB_WORKSPACE/exlaunch/source/program/nsc_cpk_bridge.cpp"

          grep -q 'InstallP88BBootSafeUJHelperProbe' \
            "$GITHUB_WORKSPACE/exlaunch/source/program/main.cpp"

          test -f \
            "$GITHUB_WORKSPACE/exlaunch/source/program/p81_ougi_awake_ids.hpp"

      - name: Verify staged P88B
        shell: bash
        run: |
          set -euxo pipefail

          ! grep -q 'InstallP88AWideUJAdmissionTrace();' \
            "$GITHUB_WORKSPACE/exlaunch/source/program/main.cpp"

          grep -q 'InstallP88BBootSafeUJHelperProbe();' \
            "$GITHUB_WORKSPACE/exlaunch/source/program/main.cpp"

          grep -q '\[NSC:P88B\] READY' \
            "$GITHUB_WORKSPACE/exlaunch/source/program/nsc_cpk_bridge.cpp"

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"

          cd "$GITHUB_WORKSPACE/exlaunch"
          make -j2

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          OUT="$(find exlaunch -type f -name subsdk9 -size +10k -print -quit)"
          test -n "$OUT"

          mkdir -p \
            artifact/atmosphere/contents/0100FA10190A0000/exefs \
            artifact/restore/atmosphere/contents/0100FA10190A0000/exefs

          cp "$OUT" \
            artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9

          cp \
            paired/atmosphere/contents/0100FA10190A0000/exefs/main \
            artifact/atmosphere/contents/0100FA10190A0000/exefs/main

          cp \
            restore/atmosphere/contents/0100FA10190A0000/exefs/main \
            artifact/restore/atmosphere/contents/0100FA10190A0000/exefs/main

          cp README_P88B.txt analyze_p88b_log.py artifact/

          (
            cd artifact
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Verify packaged mains
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          ACTIVE="$(sha256sum artifact/atmosphere/contents/0100FA10190A0000/exefs/main | awk '{print $1}')"
          RESTORE="$(sha256sum artifact/restore/atmosphere/contents/0100FA10190A0000/exefs/main | awk '{print $1}')"

          test "$ACTIVE" = "1adc4dfe948d616cbb7c6d9b3672842aba8e7d86bf0763e668505dff84234de0"
          test "$RESTORE" = "2579b0cb85b79d5515a2518caeb5d5721168dbc1ec3f92c46eb372d13488ecd9"

          echo "P88B_ACTIVE_MAIN=PASS"
          echo "P88B_RESTORE_MAIN=PASS"

          cd artifact
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NSC-P88B-bootsafe-uj-helper
          path: artifact/
          if-no-files-found: error
          compression-level: 9
