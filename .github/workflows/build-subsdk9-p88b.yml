name: Build NSC P88B boot-safe UJ helper probe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: python3 verify_p88b_source.py
      - name: Prepare
        run: |
          chmod +x prepare_exlaunch.sh
          bash prepare_exlaunch.sh
          grep -q '\[NSC:P88B\]' exlaunch/source/program/nsc_cpk_bridge.cpp
      - name: Build
        working-directory: exlaunch
        run: make -j2
      - name: Package
        run: |
          rm -rf artifact
          mkdir -p artifact/atmosphere/contents/0100FA10190A0000/exefs artifact/restore/atmosphere/contents/0100FA10190A0000/exefs
          cp exlaunch/output/subsdk9 artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9
          cp paired/atmosphere/contents/0100FA10190A0000/exefs/main artifact/atmosphere/contents/0100FA10190A0000/exefs/main
          cp restore/atmosphere/contents/0100FA10190A0000/exefs/main artifact/restore/atmosphere/contents/0100FA10190A0000/exefs/main
          cp README_P88B.txt analyze_p88b_log.py artifact/
          (cd artifact && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NSC-P88B-bootsafe-uj-helper
          path: artifact/
