name: Verify Switch port foundation (not a gameplay release)
on:
  workflow_dispatch:
  push:
    branches: [port/full-api-v170]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Build AArch64 module
        run: |
          git init -q exlaunch
          git -C exlaunch fetch --depth 1 https://github.com/shadowninja108/exlaunch.git 229bbd659b4e8d14077baec53f3e43e1eb3c196a
          git -C exlaunch checkout --detach FETCH_HEAD
          bash prepare_exlaunch.sh exlaunch
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d \
            bash -c '"$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version; make -C exlaunch -j2'
      - name: Decode audited test inputs
        run: python tools/prepare_test_images.py --r180-main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - name: Exercise production resolver and patch plan
        run: python tests/test_bootstrap.py --stock-text proof-work/stock.text --r180-text proof-work/r180.text --output proof-work
      - name: Execute compiled ARM64 callbacks and native engine slices
        run: python tests/test_native_storage.py --text proof-work/patched.text --elf exlaunch/runtime_r183.elf --output proof-work
      - name: Validate generic factory profile and Android packaging
        run: python tests/test_factory_profile.py --module exlaunch/deploy/subsdk9 --output proof-work
      - name: Execute native factory dispatch and roster identity slices
        run: python tests/test_native_factory.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --elf exlaunch/runtime_r183.elf --output proof-work
      - name: Validate explicit API event conversion
        run: python tests/test_prm_marker.py --output proof-work
      - name: Validate CPK event conversion and exact archive preservation
        run: python tests/test_cpk_events.py --output proof-work
      - name: Execute native PRM loading and event ownership
        run: python tests/test_native_events.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --elf exlaunch/runtime_r183.elf --output proof-work
      - name: Execute native control writes and permission consumers
        run: python tests/test_native_controls.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --elf exlaunch/runtime_r183.elf --output proof-work
      - name: Validate CPK profile and composed Android packaging
        run: python tests/test_cpk_profile.py --module exlaunch/deploy/subsdk9 --output proof-work
      - name: Audit inter-CPK path collisions without claiming precedence
        run: python tests/test_cpk_overlaps.py --output proof-work
      - name: Execute native CPK registration and retry branches
        run: python tests/test_native_cpk.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --elf exlaunch/runtime_r183.elf --output proof-work
      - name: Enumerate read-only native CPK and fileload call edges
        run: python tests/test_native_cpk_graph.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - name: Inspect pinned CPK indirect address references and RELA slots
        run: python tests/test_native_cpk_indirect.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - name: Inspect pinned CPK near-entrypoint and local indirect branches
        run: python tests/test_native_cpk_neighborhood.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - name: Verify authentic PC Ougi, Gudo, CharRelation raw parameter streams
        run: python tests/test_pc_param_streams.py --output proof-work
      - name: Audit pinned nearby code-pointer relocation clusters without vtable claims
        run: python tests/test_native_cpk_pointer_tables.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - name: Validate PC condition descriptors and Android packaging
        run: python tests/test_condition_profile.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --module exlaunch/deploy/subsdk9 --output proof-work
      - name: Validate raw condition companion identity and rejection
        run: python tests/test_condition_companion.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - name: Validate actual CPK entry binding for stock/candidate raw176 audits
        run: python tests/test_condition_archive_audit.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - name: Compare raw176 condition values without inferred semantics
        run: python tests/test_condition_raw_audit.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - name: Validate condition CPK bundle and coupled module profiles
        run: python tests/test_condition_bundle.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --module exlaunch/deploy/subsdk9 --output proof-work
      - name: Verify pinned PC Susanoo and Partner raw32 parameter reader layouts
        run: python tests/test_pc_param_rows.py --output proof-work
      - name: Verify last four PC ModdingAPI source-grounded raw formats against public bytes
        run: python tests/test_pc_param_remaining.py --output proof-work
      - name: Verify multi-CPK global condition batch component
        run: python tests/test_condition_batch.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --module exlaunch/deploy/subsdk9 --output proof-work
      - name: Execute native condition lookups and descriptor consumers
        run: python tests/test_native_conditions.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --elf exlaunch/runtime_r183.elf --output proof-work
      - name: Verify generated module
        run: python tools/verify_binary.py --nso exlaunch/deploy/subsdk9 --elf exlaunch/runtime_r183.elf --output proof-work/binary.json
      - uses: actions/upload-artifact@v4
        with:
          name: PORT_FOUNDATION_PROOFS_NOT_A_GAMEPLAY_RELEASE
          path: proof-work/*.json
          if-no-files-found: error
