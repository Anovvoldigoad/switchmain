name: Verify pinned FileLoad return provenance (static only)
on:
  workflow_dispatch:
  push:
    branches: [port/full-api-v170]
    paths:
      - 'tools/portlib/fileload_return_provenance.py'
      - 'tests/test_fileload_return_provenance.py'
      - 'original/atmosphere/contents/0100FA10190A0000/exefs/main'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned AArch64 decoder
        run: python -m pip install capstone==5.0.6
      - name: Trace X0 provenance at every reachable FileLoad candidate return
        run: PYTHONPATH=tools python tests/test_fileload_return_provenance.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output return-proof-work
      - uses: actions/upload-artifact@v4
        with:
          name: FILELOAD_RETURN_PROVENANCE_STATIC_EVIDENCE
          path: return-proof-work/native_fileload_return_provenance.json
          if-no-files-found: error
