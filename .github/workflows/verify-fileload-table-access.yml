name: Verify pinned FileLoad table direct-reference census
on:
  workflow_dispatch:
  push:
    branches: [port/full-api-v170]
    paths:
      - 'tools/portlib/native_fileload_table_access.py'
      - 'tests/test_native_fileload_table_access.py'
      - 'original/atmosphere/contents/0100FA10190A0000/exefs/main'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned AArch64 decoder
        run: python -m pip install capstone==5.0.6
      - name: Reproduce direct FileLoad table references and RELA inventory
        run: PYTHONPATH=tools python tests/test_native_fileload_table_access.py --main original/atmosphere/contents/0100FA10190A0000/exefs/main --output proof-work
      - uses: actions/upload-artifact@v4
        with:
          name: FILELOAD_TABLE_ACCESS_STATIC_EVIDENCE
          path: proof-work/native_fileload_table_access.json
          if-no-files-found: error
