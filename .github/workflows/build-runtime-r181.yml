name: Build NSC R252 Wait Child Readiness Trace

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify R252 wait-child readiness source
        run: python3 verify_r252.py

      - name: Clone pinned exlaunch
        run: |
          git clone https://github.com/shadowninja108/exlaunch.git exlaunch
          cd exlaunch
          git checkout 229bbd6

      - name: Apply overlay
        run: bash prepare_exlaunch.sh exlaunch

      - name: Build
        working-directory: exlaunch
        run: make -j2

      - name: Package R252 read-only wait-child readiness runtime
        shell: bash
        run: |
          set -euo pipefail
          SUBSDK="$(find exlaunch -type f -name subsdk9 -print -quit)"
          test -n "$SUBSDK"

          OUT="$GITHUB_WORKSPACE/out"
          EXE="$OUT/runtime/atmosphere/contents/0100FA10190A0000/exefs"
          mkdir -p "$EXE"
          cp "$SUBSDK" "$EXE/subsdk9"

          cd "$OUT"
          sha256sum runtime/atmosphere/contents/0100FA10190A0000/exefs/subsdk9 > SHA256SUMS.txt
          printf '%s\n' \
            'NSC2Switch R252 diagnostic: focused ccUiCharacterSelect3DModel Wait child-readiness trace after R250 bod1 fix.' \
            'Read-only. Six hooks: mtob registry capture + Wait enter/update + child ready/secondary gates + Wait consumer.' \
            'Do not copy a game main file into this package.' \
            'Deploy beside the exact R250 bod1-internal-identity-fixed carrier. Replace only diagnostic subsdk9.' \
            > INSTALL.txt

      - name: Assert no main override is shipped
        shell: bash
        run: |
          set -euo pipefail
          test ! -e out/runtime/atmosphere/contents/0100FA10190A0000/exefs/main
          test -e out/runtime/atmosphere/contents/0100FA10190A0000/exefs/subsdk9

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC2Switch-R252-WAIT-CHILD-READINESS-TRACE
          path: out/**
          if-no-files-found: error
