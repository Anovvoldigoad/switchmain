name: Build NSC R253 Load Child Construction Trace

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify R253 load-child construction source
        run: python3 verify_r253.py

      - name: Clone pinned exlaunch
        run: |
          git clone https://github.com/shadowninja108/exlaunch.git exlaunch
          cd exlaunch
          git checkout 229bbd6

      - name: Apply overlay
        run: bash prepare_exlaunch.sh exlaunch

      - name: Build
        working-directory: exlaunch
        run: make -j2

      - name: Package R253 read-only load-child construction runtime
        shell: bash
        run: |
          set -euo pipefail
          SUBSDK="$(find exlaunch -type f -name subsdk9 -print -quit)"
          test -n "$SUBSDK"

          OUT="$GITHUB_WORKSPACE/out"
          EXE="$OUT/runtime/atmosphere/contents/0100FA10190A0000/exefs"
          mkdir -p "$EXE"
          cp "$SUBSDK" "$EXE/subsdk9"

          cd "$OUT"
          sha256sum runtime/atmosphere/contents/0100FA10190A0000/exefs/subsdk9 > SHA256SUMS.txt
          printf '%s\n' \
            'NSC2Switch R253 diagnostic: focused Load::enter child-vector construction trace after R252 proved self+0x188 empty.' \
            'Read-only. Five hooks: mtob registry capture + Load enter + source-list builder + candidate resolve + child producer.' \
            'Do not copy a game main file into this package.' \
            'Deploy beside the exact R250 bod1-internal-identity-fixed carrier. Replace only diagnostic subsdk9.' \
            > INSTALL.txt

      - name: Assert no main override is shipped
        shell: bash
        run: |
          set -euo pipefail
          test ! -e out/runtime/atmosphere/contents/0100FA10190A0000/exefs/main
          test -e out/runtime/atmosphere/contents/0100FA10190A0000/exefs/subsdk9

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC2Switch-R253-LOAD-CHILD-CONSTRUCTION-TRACE
          path: out/**
          if-no-files-found: error
