name: Build NSC R266 Render Registration Producer Trace

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify R266 render registration producer source
        run: python3 verify_r266.py

      - name: Clone pinned exlaunch
        run: |
          git clone https://github.com/shadowninja108/exlaunch.git exlaunch
          cd exlaunch
          git checkout 229bbd6

      - name: Apply overlay
        run: bash prepare_exlaunch.sh exlaunch

      - name: Build
        working-directory: exlaunch
        run: make -j2

      - name: Package R266 read-only render registration producer runtime
        shell: bash
        run: |
          set -euo pipefail
          SUBSDK="$(find exlaunch -type f -name subsdk9 -print -quit)"
          test -n "$SUBSDK"

          OUT="$GITHUB_WORKSPACE/out"
          EXE="$OUT/runtime/atmosphere/contents/0100FA10190A0000/exefs"
          mkdir -p "$EXE"
          cp "$SUBSDK" "$EXE/subsdk9"

          cd "$OUT"
          sha256sum runtime/atmosphere/contents/0100FA10190A0000/exefs/subsdk9 > SHA256SUMS.txt
          printf '%s\n' \
            'NSC2Switch R266 diagnostic: exact render-registration producer chain after R265 proved submit entry objects=0.' \
            'Read-only. Eleven hooks: target capture/Wait/secondary/Draw/submit plus model child create, registration tick/bridge, render producer and producer guard.' \
            'Do not copy a game main file into this package.' \
            'Deploy beside the exact R263 sound.cpk diagnostic carrier. Replace only diagnostic subsdk9.' \
            > INSTALL.txt

      - name: Assert no main override is shipped
        shell: bash
        run: |
          set -euo pipefail
          test ! -e out/runtime/atmosphere/contents/0100FA10190A0000/exefs/main
          test -e out/runtime/atmosphere/contents/0100FA10190A0000/exefs/subsdk9

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC2Switch-R266-RENDER-REGISTRATION-PRODUCER-TRACE
          path: out/**
          if-no-files-found: error
