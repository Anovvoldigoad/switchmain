name: Build NSC R264 Secondary Preview Draw Trace

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify R264 secondary preview draw source
        run: python3 verify_r264.py

      - name: Clone pinned exlaunch
        run: |
          git clone https://github.com/shadowninja108/exlaunch.git exlaunch
          cd exlaunch
          git checkout 229bbd6

      - name: Apply overlay
        run: bash prepare_exlaunch.sh exlaunch

      - name: Build
        working-directory: exlaunch
        run: make -j2

      - name: Package R264 read-only secondary preview draw runtime
        shell: bash
        run: |
          set -euo pipefail
          SUBSDK="$(find exlaunch -type f -name subsdk9 -print -quit)"
          test -n "$SUBSDK"

          OUT="$GITHUB_WORKSPACE/out"
          EXE="$OUT/runtime/atmosphere/contents/0100FA10190A0000/exefs"
          mkdir -p "$EXE"
          cp "$SUBSDK" "$EXE/subsdk9"

          cd "$OUT"
          sha256sum runtime/atmosphere/contents/0100FA10190A0000/exefs/subsdk9 > SHA256SUMS.txt
          printf '%s\n' \
            'NSC2Switch R264 diagnostic: target secondary preview object (+0x98), nested resource/chunk lookup, draw gate, and draw-submit trace after R263.' \
            'Read-only. Seven hooks: mtob registry capture + Wait enter + secondary builder + nested file/chunk lookup + Draw + Draw submit.' \
            'Do not copy a game main file into this package.' \
            'Deploy beside the exact R263 sound.cpk diagnostic carrier. Replace only diagnostic subsdk9.' \
            > INSTALL.txt

      - name: Assert no main override is shipped
        shell: bash
        run: |
          set -euo pipefail
          test ! -e out/runtime/atmosphere/contents/0100FA10190A0000/exefs/main
          test -e out/runtime/atmosphere/contents/0100FA10190A0000/exefs/subsdk9

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC2Switch-R264-SECONDARY-PREVIEW-DRAW-TRACE
          path: out/**
          if-no-files-found: error
