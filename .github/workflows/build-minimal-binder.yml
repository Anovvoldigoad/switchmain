name: Build R276H19C Minimal CPK Binder PATH Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify mount-only source scope
        run: python3 verify_source.py

      - name: Clone pinned exlaunch
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/shadowninja108/exlaunch.git exlaunch
          git -C exlaunch checkout --detach 229bbd6
          git -C exlaunch submodule update --init --recursive
          echo '===== EXLAUNCH BUILD REVISION ====='
          git -C exlaunch rev-parse --short HEAD
          git -C exlaunch log -1 --oneline
          test "$(git -C exlaunch rev-parse --short HEAD)" = "229bbd6"

      - name: Overlay minimal binder
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' prepare_exlaunch.sh
          chmod +x prepare_exlaunch.sh
          bash ./prepare_exlaunch.sh "$GITHUB_WORKSPACE/exlaunch"

      - name: Build subsdk9
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          echo '===== DEVKITA64 TOOLCHAIN ====='
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"
          test -x "$DEVKITA64/bin/aarch64-none-elf-g++"
          "$DEVKITA64/bin/aarch64-none-elf-g++" --version | head -n 1
          command -v aarch64-none-elf-g++
          make -C exlaunch -j2

      - name: Package and hash artifact
        run: python3 package_artifact.py

      - name: Re-verify source scope after build
        run: python3 verify_source.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC-R276H19C-minimal-binder
          path: artifact/**
          if-no-files-found: error
