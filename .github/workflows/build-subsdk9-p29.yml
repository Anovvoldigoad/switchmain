name: Build NSC P29 nuccFileLoad trace
on:
  workflow_dispatch:
  push:
    paths:
      - "overlay/**"
      - "prepare_exlaunch.sh"
      - ".github/workflows/build-subsdk9-p29.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git python3 make
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm switch-dev dkp-toolchain-vars
      - name: Clone pinned exlaunch
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/shadowninja108/exlaunch.git exlaunch
          git -C exlaunch checkout --detach 229bbd6
          git -C exlaunch submodule update --init --recursive
          test "$(git -C exlaunch rev-parse --short HEAD)" = "229bbd6"
      - name: Apply P29 overlay
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x prepare_exlaunch.sh
          bash ./prepare_exlaunch.sh "$GITHUB_WORKSPACE/exlaunch"
      - name: Build subsdk9
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          cd exlaunch
          make -j2
      - name: Collect output
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$(find exlaunch -type f -name subsdk9 -size +10k | head -n 1)"
          test -n "$OUT"
          mkdir -p artifact/atmosphere/contents/0100FA10190A0000/exefs
          cp "$OUT" artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9
          sha256sum artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9 | tee artifact/SHA256SUMS.txt
      - name: Upload P29 subsdk9
        uses: actions/upload-artifact@v4
        with:
          name: NSC-P29-nuccFileLoad-trace-subsdk9
          path: artifact/
