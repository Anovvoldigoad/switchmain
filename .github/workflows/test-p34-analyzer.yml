name: Test P34 thread-scoped loader analyzer
on:
  push:
    paths:
      - "analyze_p34_log.py"
      - "test_analyze_p34.py"
      - ".github/workflows/test-p34-analyzer.yml"
  pull_request:
    paths:
      - "analyze_p34_log.py"
      - "test_analyze_p34.py"
      - ".github/workflows/test-p34-analyzer.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run nine P34 classifier regression tests
        run: python -m unittest -v test_analyze_p34.py
