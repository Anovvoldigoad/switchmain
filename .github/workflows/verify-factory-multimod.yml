name: Verify offline factory multi-mod composition
on:
  push:
    branches: [port/full-api-v170]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify raw PC record collision policy and publication
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_factory_raw_conflicts.py -v
      - name: Verify factory profile composition and rejection
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_merge_factory_profiles.py -v

      - name: Verify SHA-authenticated raw PC factory sources
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_factory_raw_source_sha.py -v
