name: Verify offline factory multi-mod composition
on:
  push:
    branches: [port/full-api-v170]
    paths:
      - 'tools/portlib/factory_*.py'
      - 'tools/compile_factory_profile.py'
      - 'tools/merge_factory_profiles.py'
      - 'tests/test_factory_*.py'
      - 'tests/test_merge_factory_profiles.py'
      - 'profiles/factory/**'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify raw PC record collision policy and publication
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_factory_raw_conflicts.py -v
      - name: Verify factory profile composition and rejection
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_merge_factory_profiles.py -v

      - name: Verify SHA-authenticated raw PC factory sources
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_factory_raw_source_sha.py -v

      - name: Verify mixed raw-PC and profile composition
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_factory_mixed_sources.py -v

      - name: Verify ordered factory composition, ownership transfer and authenticated baseline replay
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_factory_ordered_sources.py -v
