name: Build NSC P63A UJ Router First Divergence Trace

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - name: Checkout P63A build kit
        uses: actions/checkout@v4

      - name: Verify repository layout
        shell: bash
        run: |
          set -euxo pipefail
          test -f .github/workflows/build-subsdk9-p63a.yml
          test -f prepare_exlaunch.sh
          test -f verify_p63a_kit.py
          test -f overlay/source/program/nsc_cpk_bridge.cpp
          test -f deploy/atmosphere/contents/0100FA10190A0000/exefs/main
          test -f restore/atmosphere/contents/0100FA10190A0000/exefs/main

      - name: Verify devkitPro toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          test -x "$DEVKITA64/bin/aarch64-none-elf-g++"
          "$DEVKITA64/bin/aarch64-none-elf-g++" --version
          command -v git
          command -v python3

      - name: Verify P63A source and paired main
        shell: bash
        run: |
          set -euxo pipefail
          python3 generate_condition_table.py condition_compat_manifest.json /tmp/condition_compat_generated.hpp
          cmp /tmp/condition_compat_generated.hpp overlay/source/program/condition_compat_generated.hpp
          python3 verify_p63a_kit.py

      - name: Clone pinned exlaunch
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/shadowninja108/exlaunch.git "$GITHUB_WORKSPACE/exlaunch"
          git -C "$GITHUB_WORKSPACE/exlaunch" checkout --detach 229bbd6
          git -C "$GITHUB_WORKSPACE/exlaunch" submodule update --init --recursive
          test "$(git -C "$GITHUB_WORKSPACE/exlaunch" rev-parse --short HEAD)" = "229bbd6"

      - name: Overlay P63A sources
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' prepare_exlaunch.sh || true
          chmod +x prepare_exlaunch.sh
          bash ./prepare_exlaunch.sh "$GITHUB_WORKSPACE/exlaunch"
          grep -F 'ELF_EXTRACT := $(PWD)/p63a_final.elf' "$GITHUB_WORKSPACE/exlaunch/config.mk"

      - name: Build subsdk9
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          cd "$GITHUB_WORKSPACE/exlaunch"
          make -j2

      - name: Verify linked P63A and collect artifact
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          OUT="exlaunch/deploy/subsdk9"
          ELF="exlaunch/p63a_final.elf"
          test -s "$OUT"
          test -s "$ELF"

          grep -aFq '[NSC:P63A] READY' "$ELF"
          grep -aFq '[NSC:P63A] UJ_F58' "$ELF"
          grep -aFq '[NSC:P63A] UJ_POST_GATE' "$ELF"
          grep -aFq '[NSC:P63A] UJ_CTRL_GET' "$ELF"

          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          b = p.read_bytes()
          assert len(b) > 10000, len(b)
          assert b[:4] == b'NSO0', b[:4]
          print('P63A_NSO_VERIFY=PASS')
          PY

          rm -rf artifact
          mkdir -p artifact/atmosphere/contents/0100FA10190A0000/exefs
          cp "$OUT" artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9
          cp deploy/atmosphere/contents/0100FA10190A0000/exefs/main artifact/atmosphere/contents/0100FA10190A0000/exefs/main
          mkdir -p artifact/restore/atmosphere/contents/0100FA10190A0000/exefs
          cp restore/atmosphere/contents/0100FA10190A0000/exefs/main artifact/restore/atmosphere/contents/0100FA10190A0000/exefs/main
          cp README_P63A.txt P63A_STATIC_AUDIT.txt R72_CHECKPOINT.md analyze_p63a_log.py artifact/
          (cd artifact && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          sha256sum "$OUT" "$ELF"

      - name: Upload P63A artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC-P63A-uj-router-first-divergence-trace
          path: artifact/
          compression-level: 9
