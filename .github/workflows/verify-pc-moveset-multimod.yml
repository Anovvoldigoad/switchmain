name: Verify offline PC MovesetPlus multi-mod composition
on:
  push:
    branches: [port/full-api-v170]
    paths:
      - 'tools/portlib/pc_moveset_*.py'
      - 'tools/merge_pc_moveset_nsc_manifests.py'
      - 'tools/split_pc_moveset_nsc_manifests.py'
      - 'tools/reassemble_pc_moveset_owner_directory.py'
      - 'tools/verify_pc_moveset_nsc_sources.py'
      - 'tools/remove_pc_moveset_nsc_mod.py'
      - 'tools/replace_pc_moveset_nsc_mod.py'
      - 'tools/patch_pc_moveset_nsc_mods.py'
      - 'tools/reorder_pc_moveset_nsc_mods.py'
      - 'tests/test_*pc_moveset*.py'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify multi-mod editor index composition and restoration
        run: |
          PYTHONPATH=tools python -m unittest discover -s tests -p test_merge_pc_moveset_nsc_manifests.py -v
          PYTHONPATH=tools python -m unittest discover -s tests -p test_reassemble_pc_moveset_owner_directory.py -v
          PYTHONPATH=tools python -m unittest discover -s tests -p test_split_pc_moveset_nsc_manifests.py -v
          PYTHONPATH=tools python -m unittest discover -s tests -p test_verify_pc_moveset_nsc_sources.py -v
          PYTHONPATH=tools python -m unittest discover -s tests -p test_remove_pc_moveset_nsc_mod.py -v
          PYTHONPATH=tools python -m unittest discover -s tests -p test_replace_pc_moveset_nsc_mod.py -v
          PYTHONPATH=tools python -m unittest discover -s tests -p test_patch_pc_moveset_nsc_mods.py -v
          PYTHONPATH=tools python -m unittest discover -s tests -p test_reorder_pc_moveset_nsc_mods.py -v
