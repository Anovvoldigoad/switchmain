name: Build NSC P41A condition517 Event121 self

on:
  workflow_dispatch:
  push:
    paths:
      - "overlay/**"
      - "prepare_exlaunch.sh"
      - "p41_main/**"
      - "P41A_CONDITION_MAIN_AUDIT.json"
      - ".github/workflows/build-subsdk9-p41a.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - name: Checkout P41A build kit
        uses: actions/checkout@v4

      - name: Verify preinstalled devkitPro toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"
          git --version
          python3 --version
          make --version
          test -d "$DEVKITPRO"
          test -d "$DEVKITA64"
          test -d "$DEVKITPRO/libnx"
          test -x "$DEVKITA64/bin/aarch64-none-elf-g++"
          test -x "$DEVKITA64/bin/aarch64-none-elf-gcc"
          test -x "$DEVKITA64/bin/aarch64-none-elf-ld"
          "$DEVKITA64/bin/aarch64-none-elf-g++" --version
          if [[ -f "$DEVKITPRO/libnx/switch_rules" ]]; then
            echo "Found libnx switch_rules: $DEVKITPRO/libnx/switch_rules"
          elif [[ -f "$DEVKITPRO/libnx/switch_rules.mk" ]]; then
            echo "Found libnx switch_rules.mk: $DEVKITPRO/libnx/switch_rules.mk"
          else
            echo "ERROR: libnx build rules not found"
            find "$DEVKITPRO/libnx" -maxdepth 2 -type f | sort | sed -n '1,100p' || true
            exit 1
          fi

      - name: Clone pinned exlaunch
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/shadowninja108/exlaunch.git exlaunch
          git -C exlaunch checkout --detach 229bbd6
          git -C exlaunch submodule sync --recursive
          git -C exlaunch submodule update --init --recursive
          ACTUAL="$(git -C exlaunch rev-parse --short=7 HEAD)"
          echo "exlaunch commit=$ACTUAL"
          test "$ACTUAL" = "229bbd6"

      - name: Apply P41A overlay
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x prepare_exlaunch.sh
          bash ./prepare_exlaunch.sh "$GITHUB_WORKSPACE/exlaunch"
          find "$GITHUB_WORKSPACE/exlaunch/source/program" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Build subsdk9
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          cd "$GITHUB_WORKSPACE/exlaunch"
          make -j2

      - name: Collect and verify output
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          find exlaunch -type f -name subsdk9 -ls || true
          OUT="$(find exlaunch -type f -name subsdk9 -size +10k -print -quit)"
          test -n "$OUT"
          test -f "$OUT"
          mkdir -p artifact/atmosphere/contents/0100FA10190A0000/exefs
          cp "$OUT" artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9
          cp p41_main/atmosphere/contents/0100FA10190A0000/exefs/main artifact/atmosphere/contents/0100FA10190A0000/exefs/main
          test -s artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9
          test -s artifact/atmosphere/contents/0100FA10190A0000/exefs/main
          test "$(sha256sum artifact/atmosphere/contents/0100FA10190A0000/exefs/main | awk '{print $1}')" = "407ff7247a2c70941c05eb2cdfbd65a2a25fffc247845274b096ed0b5aee6ae7"
          stat artifact/atmosphere/contents/0100FA10190A0000/exefs/subsdk9 artifact/atmosphere/contents/0100FA10190A0000/exefs/main
          (cd artifact && sha256sum atmosphere/contents/0100FA10190A0000/exefs/main atmosphere/contents/0100FA10190A0000/exefs/subsdk9 | tee SHA256SUMS.txt)
          cp README_P41A.txt artifact/README_P41A.txt
          cp analyze_p41a_log.py artifact/analyze_p41a_log.py
          cp P30_MANIFEST_ROW_AUDIT.json artifact/P30_MANIFEST_ROW_AUDIT.json
          cp P41A_STATIC_AUDIT.txt artifact/P41A_STATIC_AUDIT.txt
          cp P41A_NATIVE_BOUNDARY_AUDIT.json artifact/P41A_NATIVE_BOUNDARY_AUDIT.json
          cp P41A_EVENT121_NATIVE_PROOF.json artifact/P41A_EVENT121_NATIVE_PROOF.json
          cp P41A_CONDITION_MAIN_AUDIT.json artifact/P41A_CONDITION_MAIN_AUDIT.json
          cp build_p41_condition_main.py artifact/build_p41_condition_main.py
          cp verify_p41a_kit.py artifact/verify_p41a_kit.py
          cp P41A_VERIFY_RESULT.txt artifact/P41A_VERIFY_RESULT.txt
          cp P40A_TO_P41A_SOURCE.diff artifact/P40A_TO_P41A_SOURCE.diff
          mkdir -p artifact/restore/atmosphere/contents/0100FA10190A0000/exefs
          cp restore/atmosphere/contents/0100FA10190A0000/exefs/main artifact/restore/atmosphere/contents/0100FA10190A0000/exefs/main
          sha256sum artifact/restore/atmosphere/contents/0100FA10190A0000/exefs/main | tee artifact/RESTORE_MAIN_SHA256.txt

      - name: Upload P41A main + subsdk9
        uses: actions/upload-artifact@v4
        with:
          name: NSC-P41A-condition517-event121-self
          path: artifact/
          if-no-files-found: error
          compression-level: 9
